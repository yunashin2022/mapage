<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
        <meta http-equiv="Pragma" content="no-cache" />
        <meta http-equiv="Expires" content="0" />
        <meta property="og:title" content="우리 아기 사주풀이" />
        <meta property="og:description" content="생년월일시로 알아보는 우리 아기 기질 · 재능 · 건강 포인트" />
        <title>Noel _ 아기 사주풀이</title>
        <style>
            @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
            * {
                box-sizing: border-box;
                font-family: "Pretendard", serif;
            }
            body {
                background-color: #f3ceee;
                margin: 0;
                padding: 20px 12px 60px 12px;
            }
            .top {
                max-width: 480px;
                margin: 0 auto 20px auto;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .top a {
                color: white;
                font-size: 14px;
                text-decoration: none;
                font-weight: bold;
                background-color: rgba(255,255,255,0.35);
                padding: 6px 12px;
                border-radius: 8px;
            }
            h1 {
                color: #a1266e;
                font-size: 20px;
                text-align: center;
                margin: 0 auto 6px auto;
                max-width: 480px;
            }
            .sub {
                color: #7a3d78;
                font-size: 13px;
                text-align: center;
                margin: 0 auto 20px auto;
                max-width: 480px;
                opacity: 0.9;
            }
            .card {
                max-width: 480px;
                margin: 0 auto 16px auto;
                background: white;
                border-radius: 12px;
                padding: 18px 16px;
                box-shadow: 3px 3px 8px 0px rgba(0,0,0,0.25);
                overflow: hidden;
            }
            .card h2 {
                font-size: 15px;
                color: #7a3d78;
                margin: 0 0 12px 0;
            }
            .field { margin-bottom: 16px; }
            .field:last-child { margin-bottom: 0; }
            .field label {
                display: block;
                font-size: 13px;
                font-weight: bold;
                color: #7a3d78;
                margin-bottom: 6px;
            }
            input[type="date"], input[type="time"] {
                width: 100%;
                max-width: 100%;
                min-width: 0;
                padding: 10px 8px;
                border-radius: 8px;
                border: 1px solid #eeddee;
                font-size: 16px;
                font-family: "Pretendard", serif;
                color: #333;
                outline: none;
                background: #faf6fb;
            }
            input[type="date"]:focus, input[type="time"]:focus { border-color: #e79ee0; }
            input:disabled { opacity: 0.4; }
            .time-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
            .time-row input[type="time"] { flex: 1; min-width: 110px; }
            .check-label {
                display: flex;
                align-items: center;
                gap: 5px;
                font-size: 12px;
                color: #b98cb5;
                font-weight: bold;
                white-space: nowrap;
            }
            .check-label input { accent-color: #e79ee0; width: 15px; height: 15px; }
            .gender-row { display: flex; gap: 8px; }
            .gender-pill {
                position: relative;
                flex: 1;
                text-align: center;
                padding: 10px 0;
                border-radius: 8px;
                border: 1px solid #eeddee;
                background: #faf6fb;
                font-size: 13px;
                font-weight: bold;
                color: #7a3d78;
                cursor: pointer;
            }
            .gender-pill input { position: absolute; width: 1px; height: 1px; opacity: 0; }
            .gender-pill.selected { border-color: #e79ee0; background: #fbe9fa; }
            .submit-btn {
                width: 100%;
                margin-top: 4px;
                padding: 13px;
                border: none;
                border-radius: 10px;
                background-color: #f5c6fa;
                color: white;
                font-size: 15px;
                font-weight: bold;
                cursor: pointer;
            }
            .submit-btn:hover { background-color: #e79ee0; }

            #resultSection { display: none; }

            .pillars {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(64px, 1fr));
                gap: 8px;
            }
            .pillar {
                text-align: center;
                padding: 10px 4px;
                border-radius: 8px;
                background: #faf6fb;
                border: 1px solid #eeddee;
            }
            .pillar .p-label { font-size: 11px; color: #b98cb5; font-weight: bold; margin-bottom: 6px; }
            .pillar .p-main { font-size: 16px; font-weight: bold; color: #333; }
            .pillar .p-hanja { font-size: 11px; color: #bbb; margin-top: 3px; }

            .wx-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
            .wx-row:last-child { margin-bottom: 0; }
            .wx-name { width: 40px; font-size: 13px; font-weight: bold; color: #7a3d78; flex-shrink: 0; }
            .wx-bar-bg { flex: 1; background: #faf6fb; border-radius: 8px; height: 14px; overflow: hidden; }
            .wx-bar-fill { height: 100%; border-radius: 8px; transition: width 0.5s ease; }
            .wx-count { width: 16px; font-size: 12px; color: #999; text-align: right; flex-shrink: 0; }
            .wx-summary {
                margin-top: 14px;
                padding-top: 14px;
                border-top: 1px solid #f4eef4;
                font-size: 13px;
                line-height: 1.7;
                color: #555;
            }

            .highlight-card { text-align: center; }
            .card-emoji { font-size: 26px; margin-bottom: 4px; }
            .card-title { font-size: 15px; font-weight: bold; color: #7a3d78; margin: 0 0 10px 0; }
            .card-text {
                font-size: 13.5px;
                line-height: 1.8;
                color: #444;
                text-align: left;
                margin: 0;
            }
            .tip-box {
                margin-top: 12px;
                background: #fbf3fb;
                border-radius: 8px;
                padding: 10px 12px;
                font-size: 12.5px;
                line-height: 1.7;
                color: #7a3d78;
                text-align: left;
            }
            .tip-box b { color: #d24fc9; }

            .reset-btn {
                display: block;
                max-width: 480px;
                width: 100%;
                margin: 0 auto 14px auto;
                padding: 11px;
                border-radius: 10px;
                border: 1px solid rgba(122,61,120,0.35);
                background: rgba(255,255,255,0.6);
                color: #7a3d78;
                font-size: 13px;
                font-weight: bold;
                cursor: pointer;
            }
            .share-hint {
                max-width: 480px;
                margin: 0 auto 10px auto;
                text-align: center;
                color: #7a3d78;
                font-size: 12.5px;
                opacity: 0.9;
            }
            .disclaimer {
                max-width: 480px;
                margin: 0 auto;
                text-align: center;
                color: #7a3d78;
                font-size: 11px;
                line-height: 1.6;
                opacity: 0.75;
            }
        </style>
    </head>
    <body>
        <div class="top">
            <a href="index.html">← 홈으로</a>
            <span></span>
        </div>
        <h1>🍼 우리 아기 사주풀이</h1>
        <p class="sub">태어난 날짜와 시간으로 알아보는<br>우리 아기만의 기질 &amp; 재능 &amp; 건강 포인트</p>

        <form id="sajuForm">
            <div class="card">
                <div class="field">
                    <label for="birthDate">태어난 날 (양력)</label>
                    <input type="date" id="birthDate" required>
                </div>
                <div class="field">
                    <label for="birthTime">태어난 시간</label>
                    <div class="time-row">
                        <input type="time" id="birthTime" disabled>
                        <label class="check-label"><input type="checkbox" id="timeUnknown" checked><span>시간 모름</span></label>
                    </div>
                </div>
                <div class="field">
                    <label>아기 성별</label>
                    <div class="gender-row">
                        <label class="gender-pill selected"><input type="radio" name="gender" value="boy" checked><span>👦 남아</span></label>
                        <label class="gender-pill"><input type="radio" name="gender" value="girl"><span>👧 여아</span></label>
                    </div>
                </div>
                <button type="submit" class="submit-btn">사주 풀어보기 ✨</button>
            </div>
        </form>

        <div id="resultSection">
            <div class="card">
                <h2>📜 아기 사주팔자</h2>
                <div id="pillars" class="pillars"></div>
            </div>

            <div class="card">
                <h2>🌿 오행 분포</h2>
                <div id="wxChart"></div>
                <div class="wx-summary" id="wxSummary"></div>
            </div>

            <div class="card highlight-card">
                <div class="card-emoji" id="personalityEmoji">🌱</div>
                <p class="card-title" id="personalityTitle">기질</p>
                <p class="card-text" id="personalityText"></p>
                <div class="tip-box" id="animalBox"><b id="animalLabel">🐾 띠 기운</b><br><span id="animalText"></span></div>
                <div class="tip-box"><b>💡 육아 팁</b><br><span id="personalityTip"></span></div>
            </div>

            <div class="card highlight-card">
                <div class="card-emoji">🌟</div>
                <p class="card-title">재능 포인트</p>
                <p class="card-text" id="talentText"></p>
            </div>

            <div class="card highlight-card">
                <div class="card-emoji">🩷</div>
                <p class="card-title">건강 주의점</p>
                <p class="card-text" id="healthText"></p>
            </div>

            <button id="resetBtn" class="reset-btn">다시 풀이하기 🔄</button>
            <p class="share-hint">💌 화면을 캡처해서 스토리에 공유해보세요!</p>
        </div>

        <p class="disclaimer">본 콘텐츠는 전통 사주 이론을 바탕으로 재미로 즐기는 콘텐츠이며, 의학적 진단이나 전문적인 조언을 대체하지 않습니다.</p>

        <script src="lunar.js"></script>

            // ---- DOM ----
            const form = document.getElementById('sajuForm');
            const birthDateInput = document.getElementById('birthDate');
            const birthTimeInput = document.getElementById('birthTime');
            const timeUnknownCheckbox = document.getElementById('timeUnknown');
            const resultSection = document.getElementById('resultSection');
            const resetBtn = document.getElementById('resetBtn');

            timeUnknownCheckbox.addEventListener('change', () => {
                birthTimeInput.disabled = timeUnknownCheckbox.checked;
                if (timeUnknownCheckbox.checked) birthTimeInput.value = '';
            });

            document.querySelectorAll('.gender-pill').forEach((pill) => {
                const input = pill.querySelector('input');
                input.addEventListener('change', () => {
                    document.querySelectorAll('.gender-pill').forEach((p) => p.classList.remove('selected'));
                    if (input.checked) pill.classList.add('selected');
                });
            });

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const dateVal = birthDateInput.value;
                if (!dateVal) return;

                const [y, m, d] = dateVal.split('-').map(Number);
                const timeKnown = !timeUnknownCheckbox.checked && birthTimeInput.value;

                let hour = 12, minute = 0;
                if (timeKnown) {
                    const [h, mi] = birthTimeInput.value.split(':').map(Number);
                    hour = h; minute = mi;
                }

                const solar = Solar.fromYmdHms(y, m, d, hour, minute, 0);
                const eightChar = solar.getLunar().getEightChar();

                const pillars = [
                    { label: '년주', gan: eightChar.getYearGan(), zhi: eightChar.getYearZhi() },
                    { label: '월주', gan: eightChar.getMonthGan(), zhi: eightChar.getMonthZhi() },
                    { label: '일주', gan: eightChar.getDayGan(), zhi: eightChar.getDayZhi() },
                ];
                if (timeKnown) pillars.push({ label: '시주', gan: eightChar.getTimeGan(), zhi: eightChar.getTimeZhi() });

                renderResult(pillars);
                resultSection.style.display = 'block';
                resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });

            resetBtn.addEventListener('click', () => {
                resultSection.style.display = 'none';
                form.reset();
                birthTimeInput.disabled = true;
                document.querySelectorAll('.gender-pill').forEach((p, i) => p.classList.toggle('selected', i === 0));
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            function toHangul(hanjaChar, hanjaArr, hangulArr) {
                const idx = hanjaArr.indexOf(hanjaChar);
                return idx === -1 ? '' : hangulArr[idx];
            }
            function wuxingOf(hanjaChar, hanjaArr, wuxingArr) {
                const idx = hanjaArr.indexOf(hanjaChar);
                return idx === -1 ? null : wuxingArr[idx];
            }

            function renderResult(pillars) {
                const pillarsEl = document.getElementById('pillars');
                pillarsEl.innerHTML = pillars.map((p) => {
                    const ganH = toHangul(p.gan, GAN_HANJA, GAN_HANGUL);
                    const zhiH = toHangul(p.zhi, ZHI_HANJA, ZHI_HANGUL);
                    return '<div class="pillar"><div class="p-label">' + p.label + '</div>' +
                        '<div class="p-main">' + ganH + zhiH + '</div>' +
                        '<div class="p-hanja">' + p.gan + p.zhi + '</div></div>';
                }).join('');

                const counts = { 목: 0, 화: 0, 토: 0, 금: 0, 수: 0 };
                pillars.forEach((p) => {
                    const gw = wuxingOf(p.gan, GAN_HANJA, GAN_WUXING);
                    const zw = wuxingOf(p.zhi, ZHI_HANJA, ZHI_WUXING);
                    if (gw) counts[gw]++;
                    if (zw) counts[zw]++;
                });

                const maxCount = Math.max(...Object.values(counts));
                const chartEl = document.getElementById('wxChart');
                chartEl.innerHTML = WUXING_ORDER.map((w) => {
                    const c = counts[w];
                    const pct = maxCount > 0 ? Math.max((c / maxCount) * 100, c > 0 ? 12 : 0) : 0;
                    return '<div class="wx-row"><div class="wx-name">' + WUXING_META[w].label + '</div>' +
                        '<div class="wx-bar-bg"><div class="wx-bar-fill" style="width:' + pct + '%; background:' + WUXING_META[w].color + ';"></div></div>' +
                        '<div class="wx-count">' + c + '</div></div>';
                }).join('');

                const byCountDesc = WUXING_ORDER.slice().sort((a, b) => counts[b] - counts[a]);
                const dominant = byCountDesc[0];
                const secondDominant = byCountDesc.find((w) => w !== dominant && counts[w] > 0);
                const byCountAsc = WUXING_ORDER.slice().sort((a, b) => counts[a] - counts[b]);
                const weakest = byCountAsc[0];
                const secondWeakest = byCountAsc.find((w) => w !== weakest && counts[w] <= counts[weakest] + 1);
                const zeroCount = WUXING_ORDER.filter((w) => counts[w] === 0).length;

                let summary;
                if (counts[dominant] >= 4) {
                    summary = WUXING_META[dominant].label + ' 기운이 유독 강하게 나타나는 사주예요. 이 기운의 장점을 잘 살려주는 방향으로 키워주면 큰 강점이 될 수 있어요.';
                } else if (zeroCount >= 2) {
                    summary = '몇 가지 기운이 사주에 잘 보이지 않는 편이에요. 부족한 기운은 살면서 환경과 경험으로 자연스럽게 채워질 수 있으니 크게 걱정하지 않아도 돼요.';
                } else {
                    summary = '오행이 비교적 고르게 분포된 균형 잡힌 사주예요. 다양한 방면에 두루 관심을 가질 수 있는 아이로 자랄 수 있어요.';
                }
                document.getElementById('wxSummary').textContent = summary;

                const dayGanHangul = toHangul(pillars[2].gan, GAN_HANJA, GAN_HANGUL);
                const personality = GAN_PERSONALITY[dayGanHangul];
                document.getElementById('personalityEmoji').textContent = personality.emoji;
                document.getElementById('personalityTitle').textContent = '기질 · ' + personality.title;
                document.getElementById('personalityText').textContent = personality.text;
                document.getElementById('personalityTip').textContent = personality.tip;

                const dayZhiHangul = toHangul(pillars[2].zhi, ZHI_HANJA, ZHI_HANGUL);
                const animal = ZHI_ANIMAL_TRAIT[dayZhiHangul];
                document.getElementById('animalLabel').textContent = animal.emoji + ' 띠 기운';
                document.getElementById('animalText').textContent = animal.text;

                const talentText = WUXING_TALENT[dominant] + (secondDominant ? WUXING_TALENT_EXTRA[secondDominant] : '');
                document.getElementById('talentText').textContent = talentText;

                const healthText = WUXING_HEALTH[weakest] + (secondWeakest ? WUXING_HEALTH_EXTRA[secondWeakest] : '');
                document.getElementById('healthText').textContent = healthText;
            }
        </script>
    </body>
</html>
